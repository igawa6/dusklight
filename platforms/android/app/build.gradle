plugins {
    id 'com.android.application'
}

def duskRepoDir = rootProject.projectDir.parentFile.parentFile

// Version: env override first (CI / release scripts), else derived from the
// nearest v<A>.<B>.<C>-ds-<X>.<Y>[.<Z>] git tag. The old hardcoded fallback
// (0.1.0 / 100000) shipped once by accident: the 2.1 release was built
// without the env vars, got versionCode 100000 < 2.0's 1040120, and Android
// refused it as a downgrade on every updated device.
// Code scheme: AABBCCXYZ (e.g. v1.4.1-ds-2.1.1 -> 10401211), strictly above
// every code shipped under the old AABBCCXY scheme (2.0 -> 1040120).
def gitDescribe = ""
try {
    def proc = ["git", "-C", duskRepoDir.absolutePath, "describe", "--tags", "--match", "v*-ds-*"].execute()
    proc.waitFor()
    if (proc.exitValue() == 0) {
        gitDescribe = proc.in.text.trim()
    }
} catch (ignored) {
}
def derivedName = "0.1.0"
def derivedCode = 100000
def tagMatch = gitDescribe =~ /^v(\d+)\.(\d+)\.(\d+)-ds-(\d+)\.(\d+)(?:\.(\d+))?/
if (tagMatch.find()) {
    def a = tagMatch.group(1).toInteger()
    def b = tagMatch.group(2).toInteger()
    def c = tagMatch.group(3).toInteger()
    def x = tagMatch.group(4).toInteger()
    def y = tagMatch.group(5).toInteger()
    def z = tagMatch.group(6) != null ? tagMatch.group(6).toInteger() : 0
    derivedCode = ((((a * 100 + b) * 100 + c) * 100 + x * 10 + y) * 10) + z
    derivedName = gitDescribe.replaceFirst("^v", "")
}
def versionNameStr = (System.getenv("DUSK_VERSION") ?: "v" + derivedName).replaceFirst("^v", "")
def versionCodeInt = (System.getenv("DUSK_VERSION_CODE") ?: derivedCode.toString()).toInteger()
def duskGeneratedAssetsDir = layout.buildDirectory.dir('generated/assets/dusklight').get().asFile
def syncDuskAssets = tasks.register('syncDuskAssets', Sync) {
    from(new File(duskRepoDir, 'res')) {
        into 'res'
        exclude '**/.DS_Store'
    }
    into duskGeneratedAssetsDir
}

android {
    namespace 'dev.twilitrealm.dusk'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.twilitrealm.dusk'
        minSdk 26
        targetSdk 36
        versionCode versionCodeInt
        versionName versionNameStr
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
            assets.srcDirs = [duskGeneratedAssetsDir]
        }
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'x86_64'
            universalApk false
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}

tasks.configureEach { task ->
    if ((task.name.startsWith('merge') && task.name.endsWith('Assets')) ||
        task.name.toLowerCase().contains('lint')) {
        task.dependsOn(syncDuskAssets)
    }
}
